<div id="bxh-container">
    <p>Đang tải dữ liệu bảng xếp hạng...</p>
</div>

<style>
    #bxh-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: Arial, sans-serif; }
    #bxh-table th, #bxh-table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
    #bxh-table th { background-color: #4CAF50; color: white; }
    #bxh-table tr:nth-child(even) { background-color: #f2 f2 f2; }
    #bxh-table tr:hover { background-color: #ddd; }
    .cap-bac { font-weight: bold; padding: 4px 8px; border-radius: 4px; }
</style>

<script>
    // 1. Cấu hình ID và tên Sheet
    const sheetId = '1kaL5N-PNqQfzC6wLSpKcCcZFPnlg7cae';
    const sheetName = 'Sheet1'; // Tên sheet chứa dữ liệu của bạn
    const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;

    function loadBXH() {
        fetch(base)
            .then(res => res.text())
            .then(csvText => {
                // 2. Chuyển đổi CSV thành mảng (Array)
                const rows = csvText.split('\n').map(row => {
                    // Loại bỏ dấu ngoặc kép thừa do Google Sheets xuất ra
                    return row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1'));
                });

                // 3. Tạo bảng HTML
                let tableHtml = '<table id="bxh-table"><thead><tr>';
                
                // Lấy tiêu đề (Hàng 1)
                const headers = rows[0];
                headers.forEach(header => {
                    tableHtml += `<th>${header}</th>`;
                });
                tableHtml += '</tr></thead><tbody>';

                // Lấy dữ liệu (Từ hàng 2 trở đi)
                // Lưu ý: Dữ liệu lúc này đã được Google Sheets tự động sắp xếp (nếu bạn dùng hàm SORT ở Sheets)
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i][1] === "") continue; // Bỏ qua hàng trống
                    tableHtml += '<tr>';
                    rows[i].forEach((cell, index) => {
                        // Thêm màu sắc cho cột Cấp Bậc (Cột H - index 7)
                        if (index === 7) {
                            tableHtml += `<td><span class="cap-bac">${cell}</span></td>`;
                        } else {
                            tableHtml += `<td>${cell}</td>`;
                        }
                    });
                    tableHtml += '</tr>';
                }
                tableHtml += '</tbody></table>';

                // 4. Hiển thị lên web
                document.getElementById('bxh-container').innerHTML = tableHtml;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('bxh-container').innerHTML = "Lỗi khi tải dữ liệu.";
            });
    }

    // Gọi hàm khi trang web tải xong
    window.onload = loadBXH;
</script>
