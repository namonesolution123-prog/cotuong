<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hội Cờ Đường Số 8</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; margin: 0; padding: 0; color: white; overflow-x: hidden; }
        .header { background: #d32f2f; text-align: center; padding: 15px; font-weight: bold; font-size: 18px; text-transform: uppercase; }
        
        /* CÁI KHUNG NÀY SẼ CHẶN ĐỨNG DÒNG CHỮ GOOGLE */
        .wrapper {
            margin: 15px 10px;
            background: white;
            border-radius: 10px;
            height: 400px; /* Chiều cao Nam nhìn thấy trên web */
            overflow: hidden; /* Cắt sạch phần thừa bên ngoài */
            position: relative;
            border: 2px solid #444;
        }

        .title { padding: 10px; background: #2a2a2a; color: #ff4b2b; font-weight: bold; margin: 10px 10px 0 10px; border-radius: 5px 5px 0 0; }

        iframe {
            width: 100%;
            height: 600px; /* Cho iframe cao hơn hẳn cái khung wrapper */
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        .footer { text-align: center; font-size: 11px; color: #555; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">🏆 GIẢI CỜ TƯỚNG NỘI BỘ</div>

    <div class="title">📊 BẢNG XẾP HẠNG</div>
    <div class="wrapper">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRLws0BxhVqtQIlKBeAkdWJixSDsO_fek2dJrgUz4d8_cTZ5yoDZpCSdhJgdSGO6LqoSs2R0O6OGZYa/pubhtml?gid=1726277004&amp;single=true&amp;widget=false&amp;headers=false"></iframe>
    </div>

    <div class="title">📜 LỊCH SỬ ĐẤU</div>
    <div class="wrapper" style="height: 300px;">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRLws0BxhVqtQIlKBeAkdWJixSDsO_fek2dJrgUz4d8_cTZ5yoDZpCSdhJgdSGO6LqoSs2R0O6OGZYa/pubhtml?gid=0&amp;single=true&amp;widget=false&amp;headers=false"></iframe>
    </div>

    <div class="footer">Dữ liệu bảo mật - Hội Cờ Đường Số 8</div>

</body>
</html>
