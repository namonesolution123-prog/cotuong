<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hội Cờ Tướng Đường Số 8</title>
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; padding: 0; 
        }

        .main-header {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .section-header {
            background: #fff;
            color: #d32f2f;
            padding: 12px;
            margin: 15px 10px 0 10px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            border-bottom: 2px solid #eee;
        }

        /* KHUNG CHE DÒNG CHỮ GOOGLE */
        .iframe-container {
            margin: 0 10px 20px 10px;
            background: #fff;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden; /* Cắt bỏ phần thừa */
            position: relative;
        }

        /* Mẹo: Cho iframe cao hơn khung chứa rồi dịch chuyển nó lên trên */
        iframe {
            width: 100%;
            border: none;
            display: block;
            margin-bottom: -35px; /* Đẩy dòng chữ Google xuống dưới vùng bị cắt */
        }

        .h-bxh { height: 430px; }      /* Chiều cao cho Bảng xếp hạng */
        .h-lichsu { height: 350px; }   /* Chiều cao cho Lịch sử */
        .h-taitro { height: 250px; }   /* Chiều cao cho Tài trợ */

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="main-header">🏆 GIẢI CỜ TƯỚNG NỘI BỘ</div>
